<style>

      --bg-elevated:#fffdf8;
      --card:#ffffff;
      --card-border:#e8dfc9;
      --text:#241f38;
      --text-dim:#5c5478;
      --text-faint:#8b83a3;
      --accent:#a8813a;
      --accent-soft:#f1e4c4;
      --rose:#b3595f;
      --link:#8a5a1f;
      --shadow: 0 8px 24px rgba(60,45,20,0.10);
      color-scheme: light;
    }
  }
  :root[data-theme="light"]{
    --bg:#f6f1e8;
    --bg-elevated:#fffdf8;
    --card:#ffffff;
    --card-border:#e8dfc9;
    --text:#241f38;
    --text-dim:#5c5478;
    --text-faint:#8b83a3;
    --accent:#a8813a;
    --accent-soft:#f1e4c4;
    --rose:#b3595f;
    --link:#8a5a1f;
    --shadow: 0 8px 24px rgba(60,45,20,0.10);
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    height:100vh;
    height:calc(var(--app-vh, 1vh) * 100);
  }
  #scroll-area{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .wrap{max-width:560px;margin:0 auto;padding:20px 18px 8px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0 0 6px;}
  p{line-height:1.55;color:var(--text);margin:0 0 12px;}
  .muted{color:var(--text-dim);}
  .faint{color:var(--text-faint);font-size:13px;}

    display:inline-flex;align-items:center;justify-content:center;gap:8px;

  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:.5;cursor:default;}

    background:transparent;color:var(--text);border:1px solid var(--card-border);
    border-radius:999px;padding:12px 20px;font-size:14px;font-weight:600;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .btn-outline.saved-flash{
    background:var(--accent);color:#221a08;border-color:var(--accent);
  }
  .btn-ghost{
    background:transparent;color:var(--text-dim);border:none;font-size:14px;

  }
  .btn-danger{color:var(--rose);}
  .btn-block{width:100%;}
  .card{
    background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);
    padding:20px;margin-bottom:16px;box-shadow:var(--shadow);
  }
  input,select,textarea{
    width:100%;background:var(--bg-elevated);border:1px solid var(--card-border);

  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}

  .field-row{display:flex;gap:10px;}

  .city-results{

<script>
/* =========================================================
   COSMIC TEA — data + astro engine + app
   ========================================================= */

// Measure the REAL visible height with JS rather than trusting vh/dvh —
// inside an embedded mobile view, viewport units can reflect a taller
// frame than what's actually shown, pushing fixed-bottom UI off-screen.
function setAppHeight(){
  document.documentElement.style.setProperty('--app-vh', (window.innerHeight * 0.01) + 'px');
}
setAppHeight();
window.addEventListener('resize', setAppHeight);
window.addEventListener('orientationchange', ()=>setTimeout(setAppHeight, 100));
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', setAppHeight);
}

const SIGNS = ['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
const SIGN_GLYPH = {Aries:'♈',Taurus:'♉',Gemini:'♊',Cancer:'♋',Leo:'♌',Virgo:'♍',Libra:'♎',Scorpio:'♏',Sagittarius:'♐',Capricorn:'♑',Aquarius:'♒',Pisces:'♓'};

const PLANET_GLOSS = {
  Sun:'your core identity and vitality',
  Moon:'your emotional inner world and instincts',
  Mercury:'communication, thinking, and how you process things',
  Venus:'how you love, connect, and what you value',
  Mars:'drive, desire, and how you assert yourself',
  Jupiter:'growth, luck, and where you expand',
  Saturn:'structure, limits, and discipline',
  Uranus:'sudden change, disruption, and originality',
  Neptune:'dreams, intuition, and blurred edges',
  Pluto:'transformation, intensity, and power',
  NorthNode:'the direction you\'re growing toward'
};

const HOUSE_THEME = {
  1:'you — identity, how you show up',
  2:'money, self-worth, what you value',
  3:'communication, everyday connections, quick decisions',
  4:'home, family, your inner foundation',
  5:'romance, creativity, self-expression, fun',
  6:'daily routines, health, work-in-the-weeds',
  7:'partnerships, one-on-one relationships',
  8:'intimacy, shared resources, transformation',
  9:'big ideas, travel, beliefs, the bigger picture',
  10:'career, public life, reputation',
  11:'friendship, community, future goals',
  12:'rest, the subconscious, things behind the scenes'
};

// Fixed emoji + short label per house — the app controls this header directly
// (never the AI) so it renders identically every time.
const HOUSE_EMOJI_LABEL = {
  1:{emoji:'🪞', label:'You'},
  2:{emoji:'💰', label:'Money & Worth'},
  3:{emoji:'💬', label:'Everyday Connection'},
  4:{emoji:'🏡', label:'Home & Roots'},
  5:{emoji:'🎨', label:'Romance & Creativity'},
  6:{emoji:'🌿', label:'Routine & Health'},
  7:{emoji:'❤️', label:'Partnership'},
  8:{emoji:'🔥', label:'Intimacy & Transformation'},
  9:{emoji:'🧭', label:'Big Picture'},
  10:{emoji:'🏔️', label:'Career & Public Life'},
  11:{emoji:'🌐', label:'Friendship & Community'},
  12:{emoji:'🌙', label:'Rest & Behind the Scenes'}
};

/* ---------------- LOCATION FIELDS (shared, reusable) ---------------- */
// Live city search via Open-Meteo's free geocoding API (no key needed, CORS-enabled) —
// so ANY city works, not just a short preset list, and lat/lon/UTC-offset get filled in
// automatically instead of someone having to go Google their own coordinates.
// The manual lat/lon/UTC fields stay under "Advanced" as a fallback if search ever misses.

function locationFieldsHTML(prefix, vals){
  vals = vals || {};
  return `
    <label>Birth city</label>
    <div style="position:relative;">
      <input id="${prefix}-city-name" type="text" autocomplete="off" placeholder="Start typing a city..." value="${esc(vals.cityName||'')}"
             oninput="onCityTyped('${prefix}')" onfocus="onCityTyped('${prefix}')" onblur="setTimeout(()=>hideCityResults('${prefix}'),150)">
      <div id="${prefix}-city-results" class="city-results" style="display:none;"></div>
    </div>
    <div id="${prefix}-city-confirm" class="hint" style="display:${vals.lat!=null?'block':'none'};">📍 Location set — coordinates filled in below.</div>
    <input type="hidden" id="${prefix}-tz" value="${esc(vals.tz||'')}">
    <details id="${prefix}-advanced-details" style="margin-top:10px;">
      <summary style="cursor:pointer;font-size:13px;color:var(--text-dim);">Advanced: adjust exact coordinates</summary>
      <div style="margin-top:10px;">
        <a id="${prefix}-map-link" href="#" target="_blank" rel="noopener" style="display:${vals.cityName?'inline-block':'none'};font-size:13px;margin-bottom:8px;">📍 Look up coordinates on Google Maps →</a>
        <div class="field-row">
          <div><label>Latitude</label><input id="${prefix}-lat" type="number" step="0.0001" value="${vals.lat!=null?vals.lat:''}" placeholder="e.g. 44.08" oninput="onManualCoordsEdited('${prefix}')"></div>
          <div><label>Longitude</label><input id="${prefix}-lon" type="number" step="0.0001" value="${vals.lon!=null?vals.lon:''}" placeholder="e.g. -103.23" oninput="onManualCoordsEdited('${prefix}')"></div>
        </div>
        <label>UTC offset at time of birth</label>
        <input id="${prefix}-utc" type="number" step="1" value="${vals.utc!=null?vals.utc:''}" placeholder="e.g. -7">
        <div class="hint">We fill these in automatically when you pick a city from the search results above. Only touch this if search doesn't find the city.</div>
      </div>
    </details>
  `;
}

function hideCityResults(prefix){
  const el = document.getElementById(prefix+'-city-results');
  if(el) el.style.display = 'none';
}

function updateMapLink(prefix){
  const nameEl = document.getElementById(prefix+'-city-name');
  const linkEl = document.getElementById(prefix+'-map-link');
  if(!nameEl || !linkEl) return;
  const val = nameEl.value.trim();
  if(val){
    linkEl.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(val);
    linkEl.style.display = 'inline-block';
  } else {
    linkEl.style.display = 'none';
  }
}

// If someone hand-edits lat/lon under Advanced, we no longer have a matching timezone
// name for them — clear it so date/time changes don't silently overwrite what they typed.
function onManualCoordsEdited(prefix){
  const tzEl = document.getElementById(prefix+'-tz');
  if(tzEl) tzEl.value = '';
  const confirmEl = document.getElementById(prefix+'-city-confirm');
  if(confirmEl) confirmEl.style.display = 'none';
}

const _citySearchTimers = {};
const _citySearchTokens = {};

// Live city search, debounced so we're not firing a request on every keystroke.
function onCityTyped(prefix){
  updateMapLink(prefix);
  const nameEl = document.getElementById(prefix+'-city-name');
  const resultsEl = document.getElementById(prefix+'-city-results');
  if(!nameEl || !resultsEl) return;
  const query = nameEl.value.trim();

  clearTimeout(_citySearchTimers[prefix]);
  if(query.length < 2){
    resultsEl.style.display = 'none';
    resultsEl.innerHTML = '';
    return;
  }
  _citySearchTimers[prefix] = setTimeout(() => runCitySearch(prefix, query), 350);
}

async function runCitySearch(prefix, query){
  const resultsEl = document.getElementById(prefix+'-city-results');
  if(!resultsEl) return;
  const token = Symbol();
  _citySearchTokens[prefix] = token;
  resultsEl.style.display = 'block';
  resultsEl.innerHTML = `<div class="city-result-item city-result-loading">Searching…</div>`;

  let matches = [];
  try {
    const res = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=en&format=json&name=' + encodeURIComponent(query));
    if(res.ok){
      const data = await res.json();
      matches = (data && data.results) ? data.results : [];
    }
  } catch(e){
    // network hiccup — falls through to the "no matches" message below
  }

  if(_citySearchTokens[prefix] !== token) return; // a newer search already superseded this one

  if(matches.length === 0){
    resultsEl.innerHTML = `<div class="city-result-item city-result-empty">No matches — you can enter coordinates yourself under "Advanced" below.</div>`;
    return;
  }

  const labeled = matches.map(m => {
    const bits = [m.name, m.admin1, m.country].filter(Boolean);
    const label = bits.filter((b, idx) => idx===0 || b!==bits[0]).join(', ');
    return {label, lat:m.latitude, lon:m.longitude, tz:m.timezone};
  });
  resultsEl.dataset.matches = JSON.stringify(labeled);
  resultsEl.innerHTML = labeled.map((m, i) =>
    `<div class="city-result-item" onmousedown="pickCityResult('${prefix}', ${i})">${esc(m.label)}</div>`
  ).join('');
}

function pickCityResult(prefix, idx){
  const resultsEl = document.getElementById(prefix+'-city-results');
  if(!resultsEl || !resultsEl.dataset.matches) return;
  const matches = JSON.parse(resultsEl.dataset.matches);
  const m = matches[idx];
  if(!m) return;

  document.getElementById(prefix+'-city-name').value = m.label;
  document.getElementById(prefix+'-lat').value = m.lat;
  document.getElementById(prefix+'-lon').value = m.lon;
  document.getElementById(prefix+'-tz').value = m.tz || '';
  resultsEl.style.display = 'none';
  resultsEl.innerHTML = '';
  updateMapLink(prefix);
  const confirmEl = document.getElementById(prefix+'-city-confirm');
  if(confirmEl) confirmEl.style.display = 'block';
  recomputeUtcOffset(prefix);
}

// Works out the UTC offset (in hours) for an IANA timezone at a specific wall-clock
// date/time, so daylight saving is handled correctly instead of one fixed "standard" offset.
function utcOffsetForZone(tz, dateStr, timeStr){
  if(!tz || !dateStr) return null;
  const [y, mo, d] = dateStr.split('-').map(Number);
  const [h, mi] = (timeStr || '00:00').split(':').map(Number);
  if(!y || !mo || !d) return null;

  // Converge on the offset: guess 0, see what that UTC instant reads as in the target
  // timezone, correct the guess by the difference, repeat. Settles in 1-2 passes.
  let guessOffsetMinutes = 0;
  const fmt = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour12: false,
    year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'
  });
  for(let i=0; i<3; i++){
    const asUTC = Date.UTC(y, mo-1, d, h, mi) - guessOffsetMinutes*60000;
    const parts = fmt.formatToParts(new Date(asUTC));
    const get = (t) => Number(parts.find(p=>p.type===t).value);
    const seenHour = get('hour') === 24 ? 0 : get('hour');
    const seenMinutes = Date.UTC(get('year'), get('month')-1, get('day'), seenHour, get('minute'));
    const wantedMinutes = Date.UTC(y, mo-1, d, h, mi);
    const diffMinutes = (wantedMinutes - seenMinutes) / 60000;
    if(diffMinutes === 0) break;
    guessOffsetMinutes -= diffMinutes;
  }
  return guessOffsetMinutes / 60;
}

// Re-derives the UTC offset from the stored timezone name whenever city, date, or time
// changes, so a birthdate landing in/out of daylight saving still comes out right.
function recomputeUtcOffset(prefix){
  const tzEl = document.getElementById(prefix+'-tz');
  const dateEl = document.getElementById(prefix+'-date');

  if(offset !== null) utcEl.value = offset;
}

function readLocationFields(prefix){

/* ---------------- ASTRO ENGINE ---------------- */

const PLANET_BODIES = {
  Sun:'Sun', Moon:'Moon', Mercury:'Mercury', Venus:'Venus', Mars:'Mars',
  Jupiter:'Jupiter', Saturn:'Saturn', Uranus:'Uranus', Neptune:'Neptune', Pluto:'Pluto'
};

function norm360(x){ x = x % 360; if(x<0) x += 360; return x; }

function lonToSignPos(lon){
  const idx = Math.floor(lon/30) % 12;
  const deg = lon % 30;
  return {sign:SIGNS[idx], deg:deg, glyph:SIGN_GLYPH[SIGNS[idx]]};
}

function makeUtcDate(dateStr, timeStr, utcOffsetHours){
  // dateStr: 'YYYY-MM-DD', timeStr: 'HH:MM', utcOffsetHours: number (e.g. -7)
  const [y,mo,d] = dateStr.split('-').map(Number);
  const [hh,mm] = timeStr.split(':').map(Number);
  // local wall time minus offset = UTC
  const utcMillis = Date.UTC(y, mo-1, d, hh, mm) - utcOffsetHours*3600*1000;
  return new Date(utcMillis);
}

function obliquityDeg(time){
  // Mean obliquity of the ecliptic, Meeus low-precision formula
  // NOTE: Astronomy Engine's time.tt is already days-since-J2000 TT, not a full Julian Date.
  const T = time.tt/36525;
  const eps = 23 + 26/60 + 21.448/3600
    - (46.8150/3600)*T - (0.00059/3600)*T*T + (0.001813/3600)*T*T*T;
  return eps;
}

function siderealTimeDeg(time, lonDeg){
  const gstHours = Astronomy.SiderealTime(time); // Greenwich apparent sidereal time, hours
  let lstHours = gstHours + lonDeg/15;
  lstHours = ((lstHours % 24) + 24) % 24;
  return lstHours * 15; // degrees
}

function computeAscMC(time, latDeg, lonDeg){
  const ramc = siderealTimeDeg(time, lonDeg) * Math.PI/180;
  const eps = obliquityDeg(time) * Math.PI/180;
  const lat = latDeg * Math.PI/180;

  const mcRad = Math.atan2(Math.sin(ramc), Math.cos(ramc)*Math.cos(eps));
  let mc = norm360(mcRad * 180/Math.PI);

  const ascY = Math.cos(ramc);
  const ascX = -(Math.sin(ramc)*Math.cos(eps) + Math.tan(lat)*Math.sin(eps));
  const ascRad = Math.atan2(ascY, ascX);
  let asc = norm360(ascRad * 180/Math.PI);

  return {asc, mc};
}

function meanNorthNodeLon(time){
  const T = time.tt/36525;
  let node = 125.04452 - 1934.136261*T + 0.0020708*T*T + (T*T*T)/450000;
  return norm360(node);
}

function equalHouses(ascDeg){
  const houses = [];
  for(let i=0;i<12;i++) houses.push(norm360(ascDeg + i*30));
  return houses;
}

function houseOfLongitude(lon, houses){
  const cusps = houses.concat([houses[0]+360]);
  for(let i=0;i<12;i++){
    let start = cusps[i], end = cusps[i+1];
    let lonAdj = lon >= start ? lon : lon+360;
    let endAdj = end > start ? end : end+360;
    if(lonAdj>=start && lonAdj<endAdj) return i+1;
  }
  return 1;
}

function geoEclipticLongitude(body, time){
  // Astronomy Engine's EclipticLongitude() is HELIOCENTRIC — wrong for astrology.
  // We need geocentric apparent ecliptic longitude, computed via GeoVector + Ecliptic.
  const gv = Astronomy.GeoVector(body, time, true);
  const ecl = Astronomy.Ecliptic(gv);
  return ecl.elon;
}

function planetLongitudes(time){
  const out = {};
  out.Sun = Astronomy.SunPosition(time).elon;
  out.Moon = Astronomy.EclipticGeoMoon(time).lon;
  for(const [key, body] of Object.entries(PLANET_BODIES)){
    if(key==='Sun' || key==='Moon') continue;
    out[key] = geoEclipticLongitude(body, time);
  }
  out.NorthNode = meanNorthNodeLon(time);
  return out;
}

// Build a full chart: planets w/ sign+house, angles, houses
function buildChart(dateStr, timeStr, lat, lon, utcOffset){
  const utcDate = makeUtcDate(dateStr, timeStr, utcOffset);
  const time = Astronomy.MakeTime(utcDate);
  const lons = planetLongitudes(time);
  const {asc, mc} = computeAscMC(time, lat, lon);
  const houses = equalHouses(asc);

  const planets = {};
  for(const [name, lonVal] of Object.entries(lons)){
    const sp = lonToSignPos(lonVal);
    planets[name] = {lon:lonVal, sign:sp.sign, deg:sp.deg, glyph:sp.glyph, house: houseOfLongitude(lonVal, houses)};
  }
  const ascPos = lonToSignPos(asc);
  const mcPos = lonToSignPos(mc);

  return {planets, asc:{lon:asc, sign:ascPos.sign, deg:ascPos.deg}, mc:{lon:mc, sign:mcPos.sign, deg:mcPos.deg}, houses};
}

// Light chart: sun sign only, from a birthday (no year assumption needed beyond month/day)
function sunSignFromDate(monthDay){
  // Accept any reasonable format (MM-DD, M/D, with or without a year) —
  // pull out the first two numbers found rather than assuming a strict format.
  const nums = (String(monthDay||'').match(/\d+/g) || []).map(Number);
  const mm = nums[0], dd = nums[1];
  const cutoffs = [
    [1,20,'Capricorn'],[2,19,'Aquarius'],[3,20,'Pisces'],[4,20,'Aries'],
    [5,21,'Taurus'],[6,21,'Gemini'],[7,22,'Cancer'],[8,23,'Leo'],
    [9,23,'Virgo'],[10,23,'Libra'],[11,22,'Scorpio'],[12,21,'Sagittarius'],[12,32,'Capricorn']
  ];
  if(!mm || !dd || mm<1 || mm>12 || dd<1 || dd>31) return 'Capricorn';
  for(let i=0;i<cutoffs.length;i++){
    const [cm,cd,sign] = cutoffs[i];
    if(mm<cm || (mm===cm && dd<=cd)) return sign;
  }
  return 'Capricorn';
}

const ASPECTS = {Conjunction:0, Sextile:60, Square:90, Trine:120, Opposition:180};
function angleDiff(a,b){ let d = Math.abs(a-b)%360; return Math.min(d,360-d); }

function findAspects(transitLons, natalPlanets, natalAngles, orb){
  const results = [];
  for(const [tname, tlon] of Object.entries(transitLons)){
    for(const [nname, np] of Object.entries(natalPlanets)){
      const d = angleDiff(tlon, np.lon);
      for(const [aname, aval] of Object.entries(ASPECTS)){
        const delta = Math.abs(d-aval);
        if(delta <= orb) results.push({transit:tname, aspect:aname, natal:nname, orb:delta, type:'planet'});
      }
    }
    for(const [aname2, apos] of Object.entries(natalAngles)){
      const d = angleDiff(tlon, apos.lon);
      for(const [aname, aval] of Object.entries(ASPECTS)){
        const delta = Math.abs(d-aval);
        if(delta <= orb) results.push({transit:tname, aspect:aname, natal:aname2, orb:delta, type:'angle'});
      }
    }
  }
  results.sort((a,b)=>a.orb-b.orb);
  return results;
}

// Synastry: compare two natal charts directly against each other (not transits).
// Used for "our vibe together" Orbit readings.
function findSynastryAspects(chartA, chartB, orb){
  const planetsA = {};
  for(const name of Object.keys(PLANET_BODIES)) planetsA[name] = chartA.planets[name];
  const planetsB = {};
  for(const name of Object.keys(PLANET_BODIES)) planetsB[name] = chartB.planets[name];

  const results = [];
  for(const [aName, aPos] of Object.entries(planetsA)){
    for(const [bName, bPos] of Object.entries(planetsB)){
      const d = angleDiff(aPos.lon, bPos.lon);
      for(const [aspectName, aspectVal] of Object.entries(ASPECTS)){
        const delta = Math.abs(d - aspectVal);
        if(delta <= orb) results.push({a:aName, b:bName, aspect:aspectName, orb:delta});
      }
    }
  }
  results.sort((x,y)=>x.orb-y.orb);
  return results;
}

// Decide which natal house is most "active" today — used to pick a fixed,
// app-controlled header (never left to the AI, so it's always consistent).
function determineActiveHouse(transitLons, natalChart, orb){
  const natalPlanets = {};
  for(const name of Object.keys(PLANET_BODIES)) natalPlanets[name] = natalChart.planets[name];
  natalPlanets.NorthNode = natalChart.planets.NorthNode;
  const natalAngles = {Ascendant: natalChart.asc, Midheaven: natalChart.mc};
  const aspects = findAspects(transitLons, natalPlanets, natalAngles, orb);

  if(aspects.length > 0){
    const top = aspects[0];
    if(top.natal === 'Ascendant') return 1;
    if(top.natal === 'Midheaven') return 10;
    return natalChart.planets[top.natal].house;
  }
  // Fallback: whichever house the fast-moving transiting Moon currently occupies
  return houseOfLongitude(transitLons.Moon, natalChart.houses);
}

/* ---------------- AI GENERATION (via your own Cloudflare Worker) ----------------
   Cosmic Tea used to generate readings through Claude's built-in "sample"
   capability, which only works while the app runs inside a Claude artifact.
   Now that it's a standalone page, it calls a small Worker you deploy
   yourself (see the deployment guide) — the Worker holds your Anthropic API
   key and proxies the request, so friends never need a Claude account or an
   API key of their own. */

// After you deploy the Worker, paste its URL here (looks like
// https://cosmic-tea-worker.YOUR-SUBDOMAIN.workers.dev).
const AI_CONFIG = {
  workerUrl: 'https://cosmic-tea-worker.amyfisher07.workers.dev'
};

function aiConfigured(){
  return !!AI_CONFIG.workerUrl && !AI_CONFIG.workerUrl.includes('PASTE_YOUR_WORKER_URL_HERE');
}

async function callAI(promptText, modelTier){
  const res = await fetch(AI_CONFIG.workerUrl, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({prompt: promptText, modelTier: modelTier || 'default'})
  });
  if(!res.ok){
    const errBody = await res.text().catch(()=>'');
    throw new Error('Worker error ' + res.status + (errBody ? ': ' + errBody : ''));
  }
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data.text;
}

// The model is asked to return raw JSON, but strips it defensively in case
// it wraps the object in a markdown code fence or adds stray text around it.
function extractJSON(raw){
  let t = (raw||'').trim();
  t = t.replace(/^```(?:json)?/i, '').replace(/```$/,'').trim();
  const start = t.indexOf('{');
  const end = t.lastIndexOf('}');
  if(start>=0 && end>start) t = t.slice(start, end+1);
  return JSON.parse(t);
}

function planetSummaryLine(name, p){

function buildNatalSummary(chart){
  const lines = [];
  lines.push(`Ascendant/Rising: ${chart.asc.sign} ${chart.asc.deg.toFixed(1)}°`);
  lines.push(`Midheaven: ${chart.mc.sign} ${chart.mc.deg.toFixed(1)}°`);
  for(const name of Object.keys(PLANET_BODIES)){
    lines.push(planetSummaryLine(name, chart.planets[name]));
  }
  lines.push(planetSummaryLine('NorthNode', chart.planets.NorthNode));
  return lines.join('\n');
}

function buildTransitSummary(transitLons, natalChart, orb){
  const natalPlanets = {};
  for(const name of Object.keys(PLANET_BODIES)) natalPlanets[name] = natalChart.planets[name];
  natalPlanets.NorthNode = natalChart.planets.NorthNode;
  const natalAngles = {Ascendant: natalChart.asc, Midheaven: natalChart.mc};

  const aspects = findAspects(transitLons, natalPlanets, natalAngles, orb);
  const lines = [];
  lines.push('Transiting planet positions today, and which natal house each falls in:');
  for(const [name, lonVal] of Object.entries(transitLons)){
    const sp = lonToSignPos(lonVal);
    const house = houseOfLongitude(lonVal, natalChart.houses);
    lines.push(`Transiting ${name} (${PLANET_GLOSS[name]||''}) in ${sp.sign} ${sp.deg.toFixed(1)}°, currently activating natal house ${house} (${HOUSE_THEME[house]})`);
  }
  lines.push('\nTight aspects from transiting planets to the natal chart (closest orb = most significant for today):');
  if(aspects.length===0){ lines.push('No tight aspects within orb today — lean on the house-activation data above instead.'); }
  for(const a of aspects.slice(0,10)){
    lines.push(`Transiting ${a.transit} ${a.aspect} natal ${a.natal} (orb ${a.orb.toFixed(1)}°)`);
  }
  return lines.join('\n');
}

  let userContent;
  if(friend.tier==='light'){
    const sunSign = sunSignFromDate(friend.birthMonthDay);
    const transitLons = planetLongitudes(time);
    const todaySun = lonToSignPos(transitLons.Sun).sign;
    const todayMoon = lonToSignPos(transitLons.Moon).sign;
    userContent = [
      `Reader's name: ${myName}, Sun sign: ${myChart.planets.Sun.sign}, Moon sign: ${myChart.planets.Moon.sign}`,
      `Friend's name: ${friend.name} (relation: ${friend.relation}) — only their sun sign is known: ${sunSign}`,
      pronounContext,
      `Today's transiting Sun is in ${todaySun}, today's transiting Moon is in ${todayMoon}.`,
      teaContext,
      `\nTASK: This is a LIGHT, lower-precision take since only a birthday is known for the friend — keep it teasing/general rather than claiming precision. Write about "our vibe together" today, not just the friend's vibe alone.`,
      `\n${ORBIT_FORMAT_RULES}`
    ].filter(Boolean).join('\n');
  } else {
    let friendChart;
    try{
      friendChart = buildChart(friend.birthDate, friend.birthTime||'12:00', friend.lat, friend.lon, friend.utcOffset);
    }catch(e){
      return {error:true, data:{together:`Couldn't compute ${friend.name}'s chart.`, vibeCheck:''}};
    }
    const transitLons = planetLongitudes(time);

    const synastry = findSynastryAspects(myChart, friendChart, 4).slice(0,6);
    const synastryLines = synastry.length
      ? synastry.map(s=>`Reader's ${s.a} ${s.aspect} ${friend.name}'s ${s.b} (orb ${s.orb.toFixed(1)}°)`).join('\n')
      : 'No tight synastry aspects within orb — lean on today\'s shared transits instead.';

    const myTransitHits = findAspects(transitLons, (()=>{const o={};for(const n of Object.keys(PLANET_BODIES))o[n]=myChart.planets[n];return o;})(), {Ascendant:myChart.asc, Midheaven:myChart.mc}, 3).slice(0,3);
    const friendTransitHits = findAspects(transitLons, (()=>{const o={};for(const n of Object.keys(PLANET_BODIES))o[n]=friendChart.planets[n];return o;})(), {Ascendant:friendChart.asc, Midheaven:friendChart.mc}, 3).slice(0,3);

    userContent = [
      `Reader's name: ${myName}`,
      `Friend's name: ${friend.name} (relation: ${friend.relation})`,
      pronounContext,
      `\nSYNASTRY — how their two natal charts relate to each other (a standing dynamic, not just today):\n${synastryLines}`,
      `\nToday's transits touching the READER's chart:\n${myTransitHits.map(a=>`Transiting ${a.transit} ${a.aspect} reader's natal ${a.natal} (orb ${a.orb.toFixed(1)}°)`).join('\n') || 'nothing tight today'}`,
      `\nToday's transits touching the FRIEND's chart:\n${friendTransitHits.map(a=>`Transiting ${a.transit} ${a.aspect} ${friend.name}'s natal ${a.natal} (orb ${a.orb.toFixed(1)}°)`).join('\n') || 'nothing tight today'}`,
      teaContext,
      `\nTASK: Frame "together" as how the reader's and their friend's energies interact right now, using the synastry and/or today's shared transits, whichever tells the more interesting story — and weave in the reader's context above if it's there. GENERAL/PLANETARY reasoning only where the friend's OWN unshared personal details would be involved — but the reader's own note about the relationship is fine to use freely.`,
      `\n${ORBIT_FORMAT_RULES}`
    ].filter(Boolean).join('\n');
  }

  try{
    const fullPrompt = VOICE_SYSTEM_PROMPT + '\n\n---\n\n' + userContent;
    const raw = await callAI(fullPrompt, 'quick');
    const data = extractJSON(raw);
    return {error:false, data};
  }catch(e){
    return {error:true, data:{together:`Couldn't get ${friend.name}'s vibe right now.`, vibeCheck:''}};
  }
}

const HEADER_EMOJIS = ['🌙','✨','❤️','🔮','🏔️','🌟','💫','☾','✦','🧭','💌','🎯','🪐'];

// Guarantees readable paragraph breaks no matter how the raw AI text is formatted —
// forces a break before any section-emoji header, and splits any run-on paragraph
// into shorter chunks so nothing renders as one dense block.
function autoFormat(raw){
  let text = raw.replace(/\r\n/g, '\n');

  // Force a paragraph break before any section emoji, even if it landed mid-text
  for(const e of HEADER_EMOJIS){
    text = text.split(e).join('\n\n' + e);
  }
  // Force a break before Morning/Midday/Evening sub-labels too, bold or not
  text = text.replace(/\s*(\*\*)?(Morning|Midday|Evening)(:)?(\*\*)?\s*/g, (m)=>'\n\n'+m.trim()+' ');
  text = text.replace(/\n{3,}/g, '\n\n');

  let blocks = text.split(/\n\n+/).map(b=>b.trim()).filter(Boolean);

  const finalBlocks = [];
  for(const block of blocks){
    const isHeaderish = HEADER_EMOJIS.some(e=>block.startsWith(e)) && block.length < 70;
    if(isHeaderish || block.length <= 280){
      finalBlocks.push(block);
      continue;
    }
    // Break an overly long paragraph into shorter, more scannable chunks
    const sentences = block.match(/[^.!?]+[.!?]+(\s+|$)/g) || [block];
    let chunk = '';
    for(const s of sentences){
      if((chunk + s).length > 220 && chunk){
        finalBlocks.push(chunk.trim());
        chunk = s;
      } else {
        chunk += s;
      }
    }
    if(chunk.trim()) finalBlocks.push(chunk.trim());
  }
  return finalBlocks.join('\n\n');
}

/* Fixed, app-controlled rendering for the daily reading — headers are never
   left up to the AI's formatting, so they're always Montserrat, same size,
   same weight, own line, every single time. */
function mdInline(text){
  return esc(text||'').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}
function sectionHeaderHTML(label){
  return `<div class="section-header">${label}</div>`;
}
function renderDailyHTML(data){
  let out = '';
  out += sectionHeaderHTML('✨ The Vibe');
  out += `<p>${mdInline(data.vibe)}</p>`;
  out += sectionHeaderHTML('💭 Translation');
  out += `<p>${mdInline(data.translation)}</p>`;
  out += sectionHeaderHTML('🌙 The Day\'s Rhythm');
  out += `<p><strong>Morning:</strong> ${mdInline(data.morning)}</p>`;
  out += `<p><strong>Midday:</strong> ${mdInline(data.midday)}</p>`;
  out += `<p><strong>Evening:</strong> ${mdInline(data.evening)}</p>`;
  out += sectionHeaderHTML('🧭 What Today Is Asking Of You');
  out += `<p>${mdInline(data.asking)}</p>`;

  out += `<p>${mdInline(data.assignment)}</p>`;

function setPmTier(tier){
  document.getElementById('pm-tier-light').classList.toggle('active', tier==='light');

function savePersonModal(existingId, isOnboarding){
  const name = document.getElementById('pm-name').value.trim();
  const relation = document.getElementById('pm-relation').value;
  const tier = modalRoot.dataset.tier || (document.getElementById('pm-light-fields').style.display!=='none' ? 'light':'full');
  if(!name){ alert('Give them a name first.'); return; }

  let person = {name, relation, tier};
  if(tier==='light'){
    const md = document.getElementById('pm-monthday').value.trim();
    if(!md){ alert('Add at least their birthday (month-day).'); return; }
    person.birthMonthDay = md;
  } else {
    const date = document.getElementById('pm-date').value;
    const time = document.getElementById('pm-time').value;
    const loc = readLocationFields('pm');
    const {cityName, lat, lon, utc} = loc;
    if(!date || !time || !cityName || isNaN(lat) || isNaN(lon) || utc===''){
      alert('Fill in their full birth date, time, city, and coordinates — or switch to "just their birthday."');
      return;
    }
    person.birthDate = date; person.birthTime = time; person.cityName = cityName; person.lat = lat; person.lon = lon; person.utcOffset = Number(utc); person.tz = loc.tz || null;

  if(isOnboarding){

    renderOnboarding();
    return;

  const finalized = finalizePerson(person);

    const idx = STATE.people.findIndex(p=>p.id===existingId);
    finalized.id = existingId;
    STATE.people[idx] = finalized;
  } else {
    STATE.people.push(finalized);

  closeModal();
  render();

  STATE.people = STATE.people.filter(p=>p.id!==id);

  closeModal();

async function renderPeek(){
  const mode = STATE.peekMode;
  const labels = {tomorrow:'Tomorrow', week:'This Week', month:'This Month'};
  app.innerHTML = `
    <div class="wrap">
      ${headerHTML('Cosmic Tea')}
      <p class="muted" style="margin-top:-8px;">A quick look at what's brewing next.</p>
      <div class="peek-tabs">
        ${Object.entries(labels).map(([k,l])=>`<div class="peek-tab ${mode===k?'active':''}" onclick="switchPeek('${k}')">${l}</div>`).join('')}
      </div>
      <div class="card reading" id="peek-content">
        <div class="loading-wrap"><div class="spinner"></div><div class="loading-msg">Peeking ahead...</div></div>
      </div>
    </div>
  `;
  const cacheKey = 'peekv2_'+mode+'_'+todayKey();
  const cached = STATE.cache[cacheKey];
  const contentEl = document.getElementById('peek-content');
  if(cached && typeof cached === 'object' && cached.vibe){ contentEl.innerHTML = renderPeekHTML(cached); return; }

  const result = await generatePeekReading(mode);
  if(!result.error){ STATE.cache[cacheKey] = result.data; persist('cache'); }
  if(document.getElementById('peek-content')){
    document.getElementById('peek-content').innerHTML = result.error
      ? `<p class="muted">${esc(result.text)}</p>`
      : renderPeekHTML(result.data);
  }
}
function switchPeek(mode){ STATE.peekMode = mode; renderPeek(); }

function setFmTier(tier){
  document.getElementById('fm-tier-light').classList.toggle('active', tier==='light');
  document.getElementById('fm-tier-full').classList.toggle('active', tier==='full');
  document.getElementById('fm-light-fields').style.display = tier==='light' ? 'block':'none';
  document.getElementById('fm-full-fields').style.display = tier==='full' ? 'block':'none';
  modalRoot.dataset.fmTier = tier;
}

function dateLabel(){
  return new Date().toLocaleDateString('en-US', {month:'short', day:'numeric'});
}
function appendTea(existingTea, newEntry){
  if(!newEntry) return existingTea || '';
  const stamped = `[${dateLabel()}] ${newEntry}`;
  return existingTea ? existingTea + '\n\n' + stamped : stamped;
}

function showModalError(msg){
  const el = modalRoot.querySelector('[id$="-error"]');
  if(el){ el.textContent = msg; el.style.display = 'block'; el.scrollIntoView({behavior:'smooth', block:'center'}); }
  else alert(msg);
}

function saveFriendModal(existingId){
  const name = document.getElementById('fm-name').value.trim();
  const relation = document.getElementById('fm-relation').value;
  const tier = modalRoot.dataset.fmTier || 'light';
  const pronoun = modalRoot.dataset.fmPronoun || '';
  const pronounOther = pronoun==='other' ? document.getElementById('fm-pronoun-other').value.trim() : '';
  const newTeaEntry = document.getElementById('fm-tea').value.trim();
  if(!name){ showModalError('Give them a name first.'); return; }

  const existing = existingId ? STATE.friends.find(f=>f.id===existingId) : null;
  const tea = appendTea(existing?.tea, newTeaEntry);
  const teaUpdatedAt = newTeaEntry ? Date.now() : (existing?.teaUpdatedAt || null);

  let friend = {id: existingId || ('f_' + Math.random().toString(36).slice(2,9)), name, relation, pronoun, pronounOther, tier, tea, teaUpdatedAt};
  if(tier==='light'){
    const md = document.getElementById('fm-monthday').value.trim();
    if(!md){ showModalError('Add at least their birthday (month-day).'); return; }
    friend.birthMonthDay = md;
  } else {
    const date = document.getElementById('fm-date').value;
    const time = document.getElementById('fm-time').value;
    const loc = readLocationFields('fm');
    if(!date || !time || !loc.cityName){
      showModalError('Fill in their birth date, time, and city — or switch to "just the day."');
      return;
    }
    if(isNaN(loc.lat) || isNaN(loc.lon) || loc.utc===''){
      const details = document.getElementById('fm-advanced-details');
      if(details) details.open = true;
      showModalError('We couldn\'t auto-fill coordinates for that city — tap "Advanced" above and fill in latitude, longitude and UTC offset (or use the map link to look them up).');
      return;
    }
    friend.birthDate = date; friend.birthTime = time; friend.cityName = loc.cityName;
    friend.lat = loc.lat; friend.lon = loc.lon; friend.utcOffset = Number(loc.utc); friend.tz = loc.tz || null;
  }

  if(existingId){
    const idx = STATE.friends.findIndex(f=>f.id===existingId);
    if(idx>-1) STATE.friends[idx] = friend;
  } else {
    STATE.friends.push(friend);
  }
  persist('friends');
  closeModal();
  render();
}

function teaPromptHTML(f){
  const daysSince = f.teaUpdatedAt ? Math.floor((Date.now()-f.teaUpdatedAt)/86400000) : null;
  let message, label;
  if(!f.tea){
    message = `🍵 Got tea on ${esc(f.name)}? Add it for juicier readings.`;
    label = 'Add the tea';
  } else if(daysSince!==null && daysSince>=10){
    message = `🍵 That update was ${daysSince} days ago — still the tea?`;
    label = 'Update the tea';
  } else {
    message = null;
    label = '🍵 Update the tea';
  }
  return `
    <div class="divider" style="margin:14px 0 10px;"></div>
    ${message ? `<p class="faint" style="margin-bottom:8px;">${message}</p>` : ''}
    <button class="btn-outline" style="font-size:13px;padding:9px 16px;" onclick="openTeaQuickModal('${f.id}')">${label}</button>
  `;
}

function copyBackupCode(){
  const data = {profile: STATE.profile, focus: STATE.focus, friends: STATE.friends};
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  const status = document.getElementById('backup-status');
  const showStatus = (msg)=>{ if(status){ status.textContent = msg; status.style.display = 'block'; } };
  if(navigator.clipboard){
    navigator.clipboard.writeText(code).then(()=>{
      showStatus('✓ Copied! Paste it somewhere safe — Notes, an email to yourself, anywhere findable.');
    }).catch(()=>{
      showStatus('Couldn\'t auto-copy — select and copy this manually:');
      const box = document.createElement('div');
      box.className = 'share-code-box';
      box.textContent = code;
      status.after(box);
    });
  } else {
    showStatus('Select and copy this manually:');
    const box = document.createElement('div');
    box.className = 'share-code-box';
    box.textContent = code;
    status.after(box);
  }
}

function parseBackupCode(raw){
  try{
    const data = JSON.parse(decodeURIComponent(escape(atob(raw.trim()))));
    if(!data.profile) return null;
    return data;
  }catch(e){ return null; }
}

function applyBackup(data){
  STATE.profile = data.profile;
  STATE.focus = data.focus || {areas:[], notes:''};
  STATE.friends = data.friends || [];
  STATE.cache = {};
  persist('profile'); persist('focus'); persist('friends'); persist('cache');
  STATE.tab = 'today';
  render();
}

function restoreFromBackupCode(){
  const raw = document.getElementById('restore-input').value.trim();
  const status = document.getElementById('restore-status');
  const btn = document.getElementById('restore-btn');
  const showStatus = (msg)=>{ if(status){ status.textContent = msg; status.style.display = 'block'; status.style.color = 'var(--rose)'; } };

  if(!raw){ showStatus('Paste a backup code first.'); return; }
  const data = parseBackupCode(raw);
  if(!data){ showStatus('That code doesn\'t look right — make sure you copied the whole thing.'); return; }

  if(btn.dataset.confirming !== 'true'){
    btn.dataset.confirming = 'true';
    btn.textContent = 'Tap again to confirm — this replaces what\'s here now';
    showStatus('');
    if(status) status.style.display = 'none';
    setTimeout(()=>{ if(btn.dataset.confirming==='true'){ btn.dataset.confirming='false'; btn.textContent='Restore from backup'; } }, 6000);
    return;
  }

  applyBackup(data);
}

    persist('focus');
    renderSettings();
  } else {
    if(!onboardState.areas.includes(val)) onboardState.areas.push(val);
    renderOnboarding();
  }

        <input id="ep-time" type="time" value="${p.birthTime}" onchange="recomputeUtcOffset('ep')">
        ${locationFieldsHTML('ep', {cityName:p.cityName, lat:p.lat, lon:p.lon, utc:p.utcOffset, tz:p.tz})}
        <div id="ep-error" class="hint" style="display:none;color:var(--rose);margin-top:10px;"></div>
        <button class="btn btn-block" style="margin-top:12px;" onclick="saveEditProfile()">Save changes</button>
      </div>
    </div>
  `;
}
function saveEditProfile(){
  const name = document.getElementById('ep-name').value.trim();
  const date = document.getElementById('ep-date').value;
  const time = document.getElementById('ep-time').value;
  const loc = readLocationFields('ep');
  const {cityName, lat, lon, utc} = loc;
  if(!name || !date || !time || !cityName){
    showModalError('Fill in your name, birth date, time, and city.');
    return;
  }
  if(isNaN(lat) || isNaN(lon) || utc===''){
    const details = document.getElementById('ep-advanced-details');
    if(details) details.open = true;
    showModalError('We couldn\'t auto-fill coordinates for that city — tap "Advanced" above and fill in latitude, longitude and UTC offset (or use the map link to look them up).');
    return;
  }
  let chart;
  try{ chart = buildChart(date, time, lat, lon, Number(utc)); }
  catch(e){ showModalError('Could not recalculate chart — check your info.'); return; }
  STATE.profile = {name, birthDate:date, birthTime:time, cityName, lat, lon, utcOffset:Number(utc), tz:loc.tz||null, chart};
  persist('profile');
  STATE.cache = {}; persist('cache'); // chart changed, clear cached readings
  closeModal();
  render();
}

/* ---------- TAB NAV ---------- */

document.getElementById('tabbar').addEventListener('click',(e)=>{
  const btn = e.target.closest('.tab');
  if(!btn) return;
  STATE.tab = btn.dataset.tab;
  render();
});

/* ---------- INIT ---------- */
render();
</script>
</body>
</html>
